<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meshgen viewer</title>
<style>
  html, body { margin: 0; background: #9aa3ad; color: #111; font: 13px/1.3 system-ui, sans-serif; }
  #labels { position: absolute; left: 0; top: 0; pointer-events: none; }
  #labels div { position: absolute; white-space: nowrap; padding: 2px 6px; background: rgba(255,255,255,.75); border-radius: 0 0 6px 0; }
  #ui { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 16px); }
  #ui button { font: inherit; padding: 4px 10px; border: 1px solid #555; border-radius: 6px; background: #fff; cursor: pointer; }
  #ui button.on { background: #222; color: #fff; }
  #info { position: fixed; left: 8px; bottom: 8px; background: rgba(255,255,255,.8); padding: 4px 8px; border-radius: 6px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="labels"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const sheetMode = params.get('mode') === 'sheet';
const CELL = 256, COLS = 4;

function report(value) { window.meshgenSheet = value; }

function scene() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x9aa3ad);
  s.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(2, 4, 3);
  s.add(sun);
  return s;
}

function ground(size) {
  const g = new THREE.Group();
  const grid = new THREE.GridHelper(size * 4, 16, 0x333333, 0x666666);
  g.add(grid);
  // A short arrow on the ground pointing to +Z, the model's front.
  g.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0.002, 0), size * 0.6, 0xd03030, size * 0.12, size * 0.06));
  return g;
}

try {
  const gltf = await new GLTFLoader().loadAsync('./model.glb');
  const model = gltf.scene;
  const clips = gltf.animations;
  const box = new THREE.Box3().setFromObject(model, true);
  const size = box.getSize(new THREE.Vector3());
  const height = size.y || 1;
  const span = Math.max(size.x, size.y, size.z) || 1;
  const s = scene();
  s.add(model);
  s.add(ground(span));
  const mixer = new THREE.AnimationMixer(model);

  if (sheetMode) {
    const wanted = (params.get('clips') || '').split(',').filter(Boolean);
    const shown = wanted.length ? clips.filter((c) => wanted.includes(c.name)) : clips;
    const rows = 1 + shown.length;
    const W = CELL * COLS, H = CELL * rows;
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H);
    renderer.setScissorTest(true);
    document.body.prepend(renderer.domElement);
    const labels = document.getElementById('labels');
    const cam = new THREE.PerspectiveCamera(30, 1, span / 100, span * 50);
    const center = box.getCenter(new THREE.Vector3());
    const dist = (Math.max(height, Math.max(size.x, size.z)) * 0.62) / Math.tan(THREE.MathUtils.degToRad(15));
    function shot(col, row, dir, label) {
      const target = new THREE.Vector3(center.x, box.min.y + height / 2, center.z);
      cam.position.copy(target).add(dir.clone().normalize().multiplyScalar(dist));
      cam.lookAt(target);
      const x = col * CELL, yTop = row * CELL;
      renderer.setViewport(x, H - yTop - CELL, CELL, CELL);
      renderer.setScissor(x, H - yTop - CELL, CELL, CELL);
      renderer.render(s, cam);
      const d = document.createElement('div');
      d.textContent = label;
      d.style.left = x + 'px';
      d.style.top = yTop + 'px';
      labels.appendChild(d);
    }
    const up = 0.18;
    const views = [
      ['front (+Z)', new THREE.Vector3(0, up, 1)],
      ['three-quarter', new THREE.Vector3(1, up, 1)],
      ['side (+X)', new THREE.Vector3(1, up, 0)],
      ['back', new THREE.Vector3(0, up, -1)],
    ];
    mixer.stopAllAction();
    views.forEach(([label, dir], i) => shot(i, 0, dir, `${label} · ${height.toFixed(2)} m`));
    shown.forEach((clip, r) => {
      mixer.stopAllAction();
      const action = mixer.clipAction(clip);
      action.reset().play();
      for (let k = 0; k < COLS; k++) {
        const t = (clip.duration * 0.999 * k) / (COLS - 1);
        mixer.setTime(t);
        shot(k, r + 1, new THREE.Vector3(0.8, up, 1), `${clip.name} ${t.toFixed(2)}s`);
      }
    });
    document.body.style.width = W + 'px';
    document.body.style.height = H + 'px';
    report({
      ok: true,
      clips: clips.map((c) => ({ name: c.name, duration: +c.duration.toFixed(3) })),
      shown: shown.map((c) => c.name),
      height: +height.toFixed(3),
      size: size.toArray().map((v) => +v.toFixed(3)),
    });
  } else {
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);
    const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, span / 100, span * 50);
    cam.position.set(span * 1.2, height * 0.8, span * 2.2);
    const controls = new OrbitControls(cam, renderer.domElement);
    controls.target.set(0, box.min.y + height / 2, 0);
    controls.update();
    addEventListener('resize', () => {
      cam.aspect = innerWidth / innerHeight;
      cam.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    const ui = document.createElement('div');
    ui.id = 'ui';
    document.body.appendChild(ui);
    let current = null;
    const buttons = clips.map((clip) => {
      const b = document.createElement('button');
      b.textContent = clip.name;
      b.onclick = () => {
        const next = mixer.clipAction(clip);
        next.reset().play();
        if (current && current !== next) current.crossFadeTo(next, 0.25, false);
        current = next;
        buttons.forEach((x) => x.classList.toggle('on', x === b));
      };
      ui.appendChild(b);
      return b;
    });
    const skel = new THREE.SkeletonHelper(model);
    skel.visible = false;
    s.add(skel);
    const sb = document.createElement('button');
    sb.textContent = 'bones';
    sb.onclick = () => { skel.visible = !skel.visible; sb.classList.toggle('on', skel.visible); };
    ui.appendChild(sb);
    const info = document.createElement('div');
    info.id = 'info';
    info.textContent = `${height.toFixed(2)} m tall · ${clips.length} clips · drag to orbit`;
    document.body.appendChild(info);
    if (buttons[0]) buttons[0].click();
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      mixer.update(clock.getDelta());
      renderer.render(s, cam);
    });
    report({ ok: true });
  }
} catch (err) {
  report({ error: String(err && err.message || err) });
}
</script>
</body>
</html>
