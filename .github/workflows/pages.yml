name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the demos
        run: |
          mkdir -p _site
          cp -r examples/mage _site/mage
          rm -f _site/mage/.gitignore
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=mage/"><title>meshgen</title><a href="mage/">Mage Playground</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
